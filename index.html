<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>OSMEI, Orientation Scolaire, Médiation Éducative et Interculturelle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;1,400&family=Quicksand:wght@400&display=swap" rel="stylesheet">
<style>
:root{
  --bleu:#1F5FA8; --vert:#2E7D4F; --encre:#1E2A33;
  --odd:linear-gradient(90deg,#E5243B 0 5.88%,#DDA63A 0 11.76%,#4C9F38 0 17.65%,#C5192D 0 23.53%,#FF3A21 0 29.41%,#26BDE2 0 35.29%,#FCC30B 0 41.18%,#A21942 0 47.06%,#FD6925 0 52.94%,#DD1367 0 58.82%,#FD9D24 0 64.71%,#BF8B2E 0 70.59%,#3F7E44 0 76.47%,#0A97D9 0 82.35%,#56C02B 0 88.24%,#00689D 0 94.12%,#19486A 0 100%);
  --roue:conic-gradient(#E5243B 0deg 21.2deg,#DDA63A 21.2deg 42.4deg,#4C9F38 42.4deg 63.5deg,#C5192D 63.5deg 84.7deg,#FF3A21 84.7deg 105.9deg,#26BDE2 105.9deg 127.1deg,#FCC30B 127.1deg 148.2deg,#A21942 148.2deg 169.4deg,#FD6925 169.4deg 190.6deg,#DD1367 190.6deg 211.8deg,#FD9D24 211.8deg 232.9deg,#BF8B2E 232.9deg 254.1deg,#3F7E44 254.1deg 275.3deg,#0A97D9 275.3deg 296.5deg,#56C02B 296.5deg 317.6deg,#00689D 317.6deg 338.8deg,#19486A 338.8deg 360deg);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:Verdana,Geneva,sans-serif;color:var(--encre);background:#fff;display:flex;align-items:center;justify-content:center;padding:24px}
.cadre{position:relative;width:100%;max-width:900px;padding:84px 32px 76px;text-align:center;background:#fff}
.cadre::before,.cadre::after{content:"";position:absolute;left:0;right:0;height:20px;background:var(--odd)}
.cadre::before{top:0}.cadre::after{bottom:0}
.languette-odd{position:absolute;top:20px;left:calc(100% / 17 * var(--i));width:calc(100% / 17);height:18px;border-radius:0 0 6px 6px}
.legende-odd{position:absolute;top:24px;left:50%;transform:translateX(-50%);white-space:nowrap;font-family:'Jost',sans-serif;font-size:13px;font-weight:500;letter-spacing:.04em}
.languette-odd.fin .legende-odd{left:auto;right:0;transform:none}
.logo{font-family:'Jost',sans-serif;font-weight:300;line-height:1;letter-spacing:-0.04em;white-space:nowrap;color:var(--bleu);display:inline-block;font-size:clamp(84px,16vw,160px);margin:18px 0 0}
.logo .o{display:inline-block;transform:scaleX(.82);margin:0 -.07em}
.logo .m{font-family:'Quicksand',sans-serif;font-weight:400}
.logo .i{position:relative;display:inline-block;font-family:'Playfair Display',serif;font-weight:400;font-size:.99em;letter-spacing:0;color:var(--vert)}
.logo .i::after{content:"";position:absolute;left:50%;top:-.111em;width:.222em;height:.222em;margin-left:-.111em;border-radius:50%;background:var(--roue)}
.credo{font-family:'Playfair Display',serif;font-style:italic;font-size:clamp(18px,2.6vw,24px);color:var(--vert);margin:30px 0 0}
.veille{font-family:'Jost',sans-serif;font-size:clamp(17px,2.2vw,20px);color:var(--encre);margin:36px 0 0}
.contact{font-size:14px;color:#3A4650;margin:14px 0 0}
.contact a{color:var(--bleu)}
</style>
</head>
<body>
  <div class="cadre">
    <span class="languette-odd" style="--i:3;background:#C5192D" title="ODD 4, Éducation de qualité"><span class="legende-odd" style="color:#C5192D">ODD 4 Éducation</span></span>
    <span class="languette-odd fin" style="--i:16;background:#19486A" title="ODD 17, Partenariats pour la réalisation des objectifs"><span class="legende-odd" style="color:#19486A">ODD 17 Partenariats</span></span>
    <h1 class="logo" aria-label="OSMEI"><span class="o">O</span>S<span class="m">M</span>E<span class="i">I</span></h1>
    <p class="credo">« Réduire nos excès pour enrichir le vivant. »</p>
    <p class="veille">Notre site est en cours de préparation.</p>
    <p class="contact">Pour nous écrire : <a href="mailto:osmei.org@gmail.com">osmei.org@gmail.com</a></p>
  </div>
</body>
</html>
